name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace is edition 2024, which needs rustc >= 1.85. The runner
      # image ships a stable toolchain but not necessarily a current one, and
      # an older one fails at manifest-parse time with a misleading
      # "feature `edition2024` is required".
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --locked so a stale Cargo.lock fails here instead of silently
      # resolving to different dependency versions than a local build.
      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
