[workspace]
resolver = "2"
members = [
    "crates/media-source",
    "crates/daap-server",
    "crates/media-source-dlna", "crates/media-source-fs", "crates/sharon-jones", "crates/media-source-subsonic", "crates/pict",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
bytes = "1"
hyper = { version = "1", features = ["http1", "server"] }
mdns-sd = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync"] }
tracing = "0.1"
